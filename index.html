<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram CRM - Social Media Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <span class="logo">📸</span>
                <h1>InstaCRM</h1>
            </div>
            <div class="nav-menu">
                <a href="#dashboard" class="nav-link active">Dashboard</a>
                <a href="#posts" class="nav-link">Posts</a>
                <a href="#messages" class="nav-link">Messages</a>
                <a href="#analytics" class="nav-link">Analytics</a>
                <a href="#settings" class="nav-link">Settings</a>
            </div>
            <div class="nav-user">
                <img src="https://via.placeholder.com/40" alt="User" class="user-avatar">
                <span class="user-name">John Doe</span>
            </div>
        </nav>

        <!-- Dashboard -->
        <main class="dashboard">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <h3>Followers</h3>
                        <p class="stat-value">25,432</p>
                        <span class="stat-change positive">+12.5%</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <h3>Engagement Rate</h3>
                        <p class="stat-value">4.8%</p>
                        <span class="stat-change positive">+0.6%</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div class="stat-info">
                        <h3>Total Posts</h3>
                        <p class="stat-value">1,247</p>
                        <span class="stat-change neutral">This month</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💬</div>
                    <div class="stat-info">
                        <h3>Messages</h3>
                        <p class="stat-value">89</p>
                        <span class="stat-change negative">-3 unread</span>
                    </div>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="content-grid">
                <!-- Recent Posts -->
                <div class="panel">
                    <div class="panel-header">
                        <h2>Recent Posts</h2>
                        <button class="btn-primary">New Post</button>
                    </div>
                    <div class="posts-list" id="postsList">
                        <!-- Posts will be dynamically loaded -->
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="panel">
                    <div class="panel-header">
                        <h2>Quick Actions</h2>
                    </div>
                    <div class="quick-actions">
                        <button class="action-btn">📸 Schedule Post</button>
                        <button class="action-btn">📈 View Insights</button>
                        <button class="action-btn">💬 Respond to Messages</button>
                        <button class="action-btn">👥 Manage Followers</button>
                    </div>
                </div>

                <!-- Analytics Chart -->
                <div class="panel chart-panel">
                    <div class="panel-header">
                        <h2>Growth Analytics</h2>
                        <select class="time-selector">
                            <option value="7d">Last 7 days</option>
                            <option value="30d">Last 30 days</option>
                            <option value="90d">Last 90 days</option>
                        </select>
                    </div>
                    <div class="chart-container">
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>

                <!-- Messages Preview -->
                <div class="panel">
                    <div class="panel-header">
                        <h2>Recent Messages</h2>
                        <button class="btn-secondary">View All</button>
                    </div>
                    <div class="messages-list" id="messagesList">
                        <!-- Messages will be dynamically loaded -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Post Modal -->
        <div class="modal" id="postModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create New Post</h3>
                    <button class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="postForm">
                        <div class="form-group">
                            <label>Caption</label>
                            <textarea id="postCaption" rows="4" placeholder="Write your caption..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="url" id="postImage" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="form-group">
                            <label>Schedule Date</label>
                            <input type="datetime-local" id="postSchedule">
                        </div>
                        <button type="submit" class="btn-primary">Publish Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
