<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Intraday Calculator | Position Size, Averaging, Risk Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0c15;
            --surface: #131628;
            --surface2: #1a1e35;
            --border: rgba(255,255,255,0.06);
            --text: #e4e6f0;
            --muted: #7c80a0;
            --bull: #00e676;
            --bear: #ff3d5a;
            --gold: #ffd740;
            --accent: #448aff;
            --orange: #ff9100;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(0,230,118,0.03) 0%, transparent 60%);
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .app-header {
            text-align: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--bull), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .panel-header {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .panel-header .icon { font-size: 1.3rem; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .form-row.triple {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem 0.8rem;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(68,138,255,0.1);
        }

        .form-group input.error {
            border-color: var(--bear);
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-4px)}
            75%{transform:translateX(4px)}
        }

        .trade-direction {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .dir-btn {
            flex: 1;
            padding: 0.7rem;
            text-align: center;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            color: var(--muted);
            font-family: 'Inter', sans-serif;
        }

        .dir-btn.active.long {
            background: rgba(0,230,118,0.1);
            border-color: var(--bull);
            color: var(--bull);
        }

        .dir-btn.active.short {
            background: rgba(255,61,90,0.1);
            border-color: var(--bear);
            color: var(--bear);
        }

        .section-divider {
            border-top: 1px dashed var(--border);
            margin: 1rem 0;
            padding-top: 0.8rem;
        }

        .section-label {
            font-size: 0.7rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .add-entry-btn {
            width: 100%;
            padding: 0.6rem;
            background: rgba(255,215,64,0.08);
            border: 1px dashed rgba(255,215,64,0.3);
            color: var(--gold);
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .add-entry-btn:hover {
            background: rgba(255,215,64,0.15);
            border-color: var(--gold);
        }

        .remove-entry-btn {
            background: rgba(255,61,90,0.1);
            border: 1px solid rgba(255,61,90,0.2);
            color: var(--bear);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .remove-entry-btn:hover {
            background: rgba(255,61,90,0.2);
        }

        .entry-row {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0.6rem;
            background: var(--surface2);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .entry-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .entry-row .form-group input {
            font-size: 0.8rem;
            padding: 0.5rem;
        }

        .entry-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--gold);
            font-weight: 700;
            min-width: 20px;
        }

        .btn-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            border: none;
            letter-spacing: 0.3px;
        }

        .btn-calculate {
            background: linear-gradient(135deg, var(--accent), #5c6bff);
            color: #fff;
            box-shadow: 0 8px 25px rgba(68,138,255,0.3);
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(68,138,255,0.45);
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .btn-reset:hover {
            border-color: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* Results */
        .results-scroll {
            max-height: 600px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--surface2) transparent;
        }

        .results-scroll::-webkit-scrollbar { width: 4px; }
        .results-scroll::-webkit-scrollbar-track { background: transparent; }
        .results-scroll::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

        .result-block {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
        }

        .result-block.danger {
            border-color: rgba(255,61,90,0.3);
            background: rgba(255,61,90,0.03);
        }

        .result-block.success {
            border-color: rgba(0,230,118,0.3);
            background: rgba(0,230,118,0.03);
        }

        .result-block.warning {
            border-color: rgba(255,145,0,0.3);
            background: rgba(255,145,0,0.03);
        }

        .result-title {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .result-row:last-child { border-bottom: none; }

        .result-label-sm {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .result-value-lg {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .result-value-md {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
        }

        .result-value-sm {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .green { color: var(--bull); }
        .red { color: var(--bear); }
        .gold { color: var(--gold); }
        .orange { color: var(--orange); }
        .white { color: #fff; }

        .big-number {
            text-align: center;
            padding: 1rem;
        }

        .big-number .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .big-number .label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .empty-results {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        .empty-results .emoji { font-size: 3rem; margin-bottom: 0.5rem; }

        .warning-banner {
            background: rgba(255,61,90,0.08);
            border: 1px solid rgba(255,61,90,0.2);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.72rem;
            color: var(--bear);
            font-weight: 600;
            margin-top: 0.8rem;
            display: none;
        }

        .warning-banner.show { display: block; }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr 1fr; }
            .form-row.triple { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 500px) {
            .form-row, .form-row.triple { grid-template-columns: 1fr; }
            .btn-row { flex-direction: column; }
            .big-number .value { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h1>📊 Intraday Trade Calculator Pro</h1>
            <p class="subtitle">Position Sizing • Risk Management • Averaging • R:R Analysis</p>
        </div>

        <div class="main-grid">
            
            <!-- INPUT PANEL -->
            <div class="panel" id="inputPanel">
                <div class="panel-header"><span class="icon">🎯</span> Trade Parameters</div>

                <!-- Trade Direction -->
                <div class="trade-direction" id="tradeDir">
                    <button class="dir-btn active long" onclick="setDirection('LONG', this)">📈 LONG (Buy)</button>
                    <button class="dir-btn short" onclick="setDirection('SHORT', this)">📉 SHORT (Sell)</button>
                </div>

                <!-- Account & Risk -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Account Capital (₹)</label>
                        <input type="number" id="capital" placeholder="1,00,000" min="1000" step="1000" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Max Risk Per Trade (%)</label>
                        <input type="number" id="riskPercent" placeholder="1-2" min="0.1" max="10" step="0.1" value="2" oninput="autoCalc()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Lot Size (Equity=1, F&O=Lot)</label>
                        <input type="number" id="lotSize" placeholder="1" min="1" step="1" value="1" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Brokerage Per Trade (₹)</label>
                        <input type="number" id="brokerage" placeholder="20" min="0" step="1" value="20" oninput="autoCalc()">
                    </div>
                </div>

                <!-- Stop Loss -->
                <div class="form-row full">
                    <div class="form-group">
                        <label>Stop Loss Type</label>
                        <select id="slType" onchange="toggleSLFields(); autoCalc();">
                            <option value="price">Fixed Price Stop Loss</option>
                            <option value="percent">Percentage Based Stop Loss</option>
                            <option value="points">Points Based Stop Loss</option>
                            <option value="atr">ATR Based Stop Loss</option>
                        </select>
                    </div>
                </div>

                <div class="form-row" id="slFixedRow">
                    <div class="form-group">
                        <label>Stop Loss Price (₹)</label>
                        <input type="number" id="slPrice" placeholder="1430.00" min="0.05" step="0.05" oninput="autoCalc()">
                    </div>
                </div>

                <div class="form-row" id="slPercentRow" style="display:none;">
                    <div class="form-group">
                        <label>Stop Loss % from Entry</label>
                        <input type="number" id="slPercentVal" placeholder="1.5" min="0.1" max="20" step="0.1" oninput="autoCalc()">
                    </div>
                </div>

                <div class="form-row" id="slPointsRow" style="display:none;">
                    <div class="form-group">
                        <label>Stop Loss (Points)</label>
                        <input type="number" id="slPoints" placeholder="20" min="1" step="1" oninput="autoCalc()">
                    </div>
                </div>

                <div class="form-row" id="slAtrRow" style="display:none;">
                    <div class="form-group">
                        <label>Current ATR Value</label>
                        <input type="number" id="atrValue" placeholder="35.5" min="0.1" step="0.1" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>ATR Multiplier</label>
                        <input type="number" id="atrMultiplier" placeholder="1.5" min="0.5" max="5" step="0.1" value="1.5" oninput="autoCalc()">
                    </div>
                </div>

                <!-- Target -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Target 1 Price (₹)</label>
                        <input type="number" id="target1" placeholder="1500.00" min="0.05" step="0.05" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Qty at Target 1 (%)</label>
                        <input type="number" id="target1Qty" placeholder="50" min="0" max="100" step="10" value="50" oninput="autoCalc()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Target 2 Price (₹)</label>
                        <input type="number" id="target2" placeholder="1550.00" min="0.05" step="0.05" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Trailing SL (Points)</label>
                        <input type="number" id="trailingSL" placeholder="10" min="0" step="1" value="0" oninput="autoCalc()">
                    </div>
                </div>

                <!-- AVERAGING SECTION -->
                <div class="section-divider"></div>
                <div class="section-label">📦 Position Averaging (Multiple Entries)</div>

                <div id="entriesContainer">
                    <!-- Entry 1 (Primary) -->
                    <div class="entry-row" id="entryRow1">
                        <span class="entry-number">E1</span>
                        <div class="form-group">
                            <label>Entry Price (₹)</label>
                            <input type="number" class="entry-price" id="entryPrice1" placeholder="1450.00" min="0.05" step="0.05" oninput="autoCalc()">
                        </div>
                        <div class="form-group">
                            <label>Qty %</label>
                            <input type="number" class="entry-qty" id="entryQty1" placeholder="100" min="1" max="100" step="1" value="100" oninput="autoCalc()">
                        </div>
                    </div>

                    <!-- Entry 2 -->
                    <div class="entry-row" id="entryRow2" style="display:none;">
                        <span class="entry-number">E2</span>
                        <div class="form-group">
                            <label>Entry Price (₹)</label>
                            <input type="number" class="entry-price" id="entryPrice2" placeholder="1430.00" min="0.05" step="0.05" oninput="autoCalc()">
                        </div>
                        <div class="form-group">
                            <label>Qty %</label>
                            <input type="number" class="entry-qty" id="entryQty2" placeholder="50" min="1" max="200" step="1" value="50" oninput="autoCalc()">
                        </div>
                        <button class="remove-entry-btn" onclick="removeEntry(2)">✕</button>
                    </div>

                    <!-- Entry 3 -->
                    <div class="entry-row" id="entryRow3" style="display:none;">
                        <span class="entry-number">E3</span>
                        <div class="form-group">
                            <label>Entry Price (₹)</label>
                            <input type="number" class="entry-price" id="entryPrice3" placeholder="1410.00" min="0.05" step="0.05" oninput="autoCalc()">
                        </div>
                        <div class="form-group">
                            <label>Qty %</label>
                            <input type="number" class="entry-qty" id="entryQty3" placeholder="50" min="1" max="200" step="1" value="50" oninput="autoCalc()">
                        </div>
                        <button class="remove-entry-btn" onclick="removeEntry(3)">✕</button>
                    </div>
                </div>

                <button class="add-entry-btn" id="addEntryBtn" onclick="addEntry()">+ Add Averaging Entry</button>

                <div class="btn-row">
                    <button class="btn btn-calculate" onclick="calculateAll()">🔢 Calculate Everything</button>
                    <button class="btn btn-reset" onclick="resetAll()">↺ Reset</button>
                </div>
            </div>

            <!-- RESULTS PANEL -->
            <div class="panel" id="resultsPanel">
                <div class="panel-header"><span class="icon">📊</span> Trade Analysis</div>
                <div class="results-scroll">
                    <div id="emptyResults" class="empty-results">
                        <div class="emoji">📝</div>
                        <p>Enter parameters & click <strong>Calculate</strong></p>
                    </div>
                    <div id="resultsContent" style="display:none;"></div>
                    <div class="warning-banner" id="warningBanner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let direction = 'LONG';
        let entryCount = 1;

        function setDirection(dir, btn) {
            direction = dir;
            document.querySelectorAll('.dir-btn').forEach(b => {
                b.classList.remove('active', 'long', 'short');
            });
            btn.classList.add('active', dir.toLowerCase());
            autoCalc();
        }

        function toggleSLFields() {
            const type = document.getElementById('slType').value;
            document.getElementById('slFixedRow').style.display = type === 'price' ? 'flex' : 'none';
            document.getElementById('slPercentRow').style.display = type === 'percent' ? 'flex' : 'none';
            document.getElementById('slPointsRow').style.display = type === 'points' ? 'flex' : 'none';
            document.getElementById('slAtrRow').style.display = type === 'atr' ? 'flex' : 'none';
            autoCalc();
        }

        function addEntry() {
            if (entryCount >= 3) {
                document.getElementById('addEntryBtn').textContent = 'Max 3 entries allowed';
                setTimeout(() => document.getElementById('addEntryBtn').textContent = '+ Add Averaging Entry', 1500);
                return;
            }
            entryCount++;
            document.getElementById('entryRow' + entryCount).style.display = 'flex';
            if (entryCount >= 3) document.getElementById('addEntryBtn').style.display = 'none';
            autoCalc();
        }

        function removeEntry(num) {
            document.getElementById('entryRow' + num).style.display = 'none';
            document.getElementById('entryPrice' + num).value = '';
            document.getElementById('entryQty' + num).value = '';
            entryCount--;
            document.getElementById('addEntryBtn').style.display = 'block';
            // Reorder remaining entries
            if (num === 2 && entryCount === 2) {
                // Move entry 3 to entry 2 position
                document.getElementById('entryPrice2').value = document.getElementById('entryPrice3').value;
                document.getElementById('entryQty2').value = document.getElementById('entryQty3').value;
                document.getElementById('entryRow3').style.display = 'none';
                document.getElementById('entryRow2').style.display = 'flex';
            }
            autoCalc();
        }

        function getVal(id) {
            const val = parseFloat(document.getElementById(id).value);
            return isNaN(val) || val < 0 ? null : val;
        }

        function getSLDistance(entryPrice) {
            const slType = document.getElementById('slType').value;
            switch(slType) {
                case 'price':
                    const slPrice = getVal('slPrice');
                    return slPrice ? Math.abs(entryPrice - slPrice) : null;
                case 'percent':
                    const slPct = getVal('slPercentVal');
                    return slPct ? (entryPrice * slPct / 100) : null;
                case 'points':
                    return getVal('slPoints');
                case 'atr':
                    const atr = getVal('atrValue');
                    const mult = getVal('atrMultiplier') || 1.5;
                    return atr ? atr * mult : null;
                default:
                    return null;
            }
        }

        function autoCalc() {
            const capital = getVal('capital');
            const entry1 = getVal('entryPrice1');
            if (capital && entry1) calculateAll();
        }

        function calculateAll() {
            const capital = getVal('capital');
            const riskPercent = getVal('riskPercent');
            const lotSize = getVal('lotSize') || 1;
            const brokerage = getVal('brokerage') || 0;
            const target1 = getVal('target1');
            const target1Qty = getVal('target1Qty') || 50;
            const target2 = getVal('target2');
            const trailingSL = getVal('trailingSL') || 0;

            if (!capital || !riskPercent) {
                showWarning('Please enter Account Capital and Risk %');
                return;
            }

            // Collect all active entries
            const entries = [];
            for (let i = 1; i <= 3; i++) {
                const price = getVal('entryPrice' + i);
                const qtyPct = getVal('entryQty' + i);
                if (price && qtyPct) {
                    entries.push({ num: i, price: price, qtyPct: qtyPct });
                }
            }

            if (entries.length === 0) {
                showWarning('Please enter at least Entry 1 price');
                return;
            }

            // Primary entry is the first one
            const primaryEntry = entries[0].price;
            const slDistance = getSLDistance(primaryEntry);

            if (!slDistance || slDistance <= 0) {
                showWarning('Please set a valid Stop Loss');
                return;
            }

            // Validate SL direction
            if (direction === 'LONG' && document.getElementById('slType').value === 'price') {
                const slPrice = getVal('slPrice');
                if (slPrice && slPrice >= primaryEntry) {
                    showWarning('For LONG trade, Stop Loss must be BELOW Entry Price');
                    return;
                }
            }
            if (direction === 'SHORT' && document.getElementById('slType').value === 'price') {
                const slPrice = getVal('slPrice');
                if (slPrice && slPrice <= primaryEntry) {
                    showWarning('For SHORT trade, Stop Loss must be ABOVE Entry Price');
                    return;
                }
            }

            // Calculate total quantity percentages
            const totalQtyPct = entries.reduce((sum, e) => sum + e.qtyPct, 0);

            // Calculate weighted average entry price
            let weightedSum = 0;
            entries.forEach(e => { weightedSum += e.price * e.qtyPct; });
            const avgEntryPrice = weightedSum / totalQtyPct;

            // Risk amount
            const maxRiskAmount = (capital * riskPercent) / 100;

            // Position size based on primary entry and SL distance
            let rawPositionSize = maxRiskAmount / slDistance;
            // Round down to lot size
            let positionSize = Math.floor(rawPositionSize / lotSize) * lotSize;
            if (positionSize < lotSize) positionSize = lotSize;

            // Distribute position across entries
            const entryDetails = entries.map(e => {
                const qty = Math.floor((positionSize * e.qtyPct) / totalQtyPct);
                return { ...e, qty: qty, cost: qty * e.price };
            });

            const totalShares = entryDetails.reduce((sum, e) => sum + e.qty, 0);
            const totalCapitalUsed = entryDetails.reduce((sum, e) => sum + e.cost, 0);
            const capitalUsedPercent = (totalCapitalUsed / capital) * 100;

            // Actual risk based on average entry
            const actualSLPrice = direction === 'LONG' ? avgEntryPrice - slDistance : avgEntryPrice + slDistance;
            const actualRiskPerShare = Math.abs(avgEntryPrice - actualSLPrice);
            const totalRiskAmount = actualRiskPerShare * totalShares;

            // Target calculations
            let target1Gain = 0, target2Gain = 0, totalTargetGain = 0;
            let riskReward1 = null, riskReward2 = null;

            if (target1 && target1 > 0) {
                const t1Distance = Math.abs(target1 - avgEntryPrice);
                const t1Shares = Math.floor(totalShares * target1Qty / 100);
                target1Gain = t1Distance * t1Shares - brokerage;
                riskReward1 = t1Distance / slDistance;

                if (target2 && target2 > 0) {
                    const t2Distance = Math.abs(target2 - avgEntryPrice);
                    const t2Shares = totalShares - t1Shares;
                    target2Gain = t2Distance * t2Shares - brokerage;
                    riskReward2 = t2Distance / slDistance;
                    totalTargetGain = target1Gain + target2Gain;
                } else {
                    totalTargetGain = target1Gain;
                }
            }

            // Trailing SL benefit
            const trailingSLBenefit = trailingSL > 0 ? trailingSL * totalShares : 0;

            // Brokerage impact
            const totalBrokerage = brokerage * entries.length;

            // Display results
            displayResults({
                capital, riskPercent, maxRiskAmount, direction,
                entries: entryDetails,
                avgEntryPrice, totalShares, totalCapitalUsed, capitalUsedPercent,
                slDistance, actualSLPrice, totalRiskAmount, actualRiskPerShare,
                target1, target1Qty, target2, target1Gain, target2Gain, totalTargetGain,
                riskReward1, riskReward2, trailingSL, trailingSLBenefit,
                totalBrokerage, lotSize
            });
        }

        function displayResults(data) {
            document.getElementById('emptyResults').style.display = 'none';
            document.getElementById('resultsContent').style.display = 'block';
            document.getElementById('warningBanner').classList.remove('show');

            const fmt = (n) => Math.round(n).toLocaleString('en-IN');
            const fmtD = (n, d = 2) => n.toFixed(d);
            const inr = (n) => '₹' + fmt(n);

            let html = '';

            // Position Size Block
            html += `
            <div class="result-block success">
                <div class="result-title">📦 Position Size Summary</div>
                <div class="big-number">
                    <div class="value green">${data.totalShares} Shares</div>
                    <div class="label">Total Position Size | Lot Size: ${data.lotSize}</div>
                </div>
                <div class="result-row"><span class="result-label-sm">Average Entry Price</span><span class="result-value-md white">${inr(data.avgEntryPrice)}</span></div>
                <div class="result-row"><span class="result-label-sm">Total Capital Used</span><span class="result-value-md gold">${inr(data.totalCapitalUsed)} (${fmtD(data.capitalUsedPercent, 1)}%)</span></div>
            `;

            // Entry breakdown
            data.entries.forEach((e, i) => {
                html += `
                <div class="result-row">
                    <span class="result-label-sm">Entry ${i+1} @ ${inr(e.price)} (${e.qtyPct}%)</span>
                    <span class="result-value-sm white">${e.qty} shares | ${inr(e.cost)}</span>
                </div>`;
            });
            html += `</div>`;

            // Risk Block
            html += `
            <div class="result-block ${data.capitalUsedPercent > 25 ? 'danger' : ''}">
                <div class="result-title">⚠️ Risk Analysis</div>
                <div class="result-row"><span class="result-label-sm">Max Risk Amount (${data.riskPercent}%)</span><span class="result-value-md red">${inr(data.maxRiskAmount)}</span></div>
                <div class="result-row"><span class="result-label-sm">Stop Loss Distance</span><span class="result-value-md orange">${fmtD(data.slDistance, 2)} points</span></div>
                <div class="result-row"><span class="result-label-sm">Stop Loss Price</span><span class="result-value-md red">${inr(data.actualSLPrice)}</span></div>
                <div class="result-row"><span class="result-label-sm">Risk Per Share</span><span class="result-value-sm red">${inr(data.actualRiskPerShare)}</span></div>
                <div class="result-row"><span class="result-label-sm">Total Risk if SL Hits</span><span class="result-value-lg red">${inr(data.totalRiskAmount)}</span></div>
            `;
            if (data.capitalUsedPercent > 25) {
                html += `<div style="color:var(--bear);font-size:0.7rem;margin-top:0.5rem;">⚠️ Position uses ${fmtD(data.capitalUsedPercent, 1)}% of capital — consider reducing</div>`;
            }
            html += `</div>`;

            // Target Block
            if (data.target1) {
                html += `
                <div class="result-block warning">
                    <div class="result-title">🎯 Target Analysis</div>
                    <div class="result-row"><span class="result-label-sm">Target 1 @ ${inr(data.target1)} (${data.target1Qty}% qty)</span><span class="result-value-md green">+${inr(data.target1Gain)}</span></div>
                `;
                if (data.target2) {
                    html += `<div class="result-row"><span class="result-label-sm">Target 2 @ ${inr(data.target2)} (remaining qty)</span><span class="result-value-md green">+${inr(data.target2Gain)}</span></div>`;
                }
                html += `<div class="result-row"><span class="result-label-sm">Total Potential Profit</span><span class="result-value-lg green">+${inr(data.totalTargetGain)}</span></div>`;
                if (data.trailingSL > 0) {
                    html += `<div class="result-row"><span class="result-label-sm">Trailing SL Benefit</span><span class="result-value-sm gold">${inr(data.trailingSLBenefit)} locked profit</span></div>`;
                }
                html += `</div>`;
            }

            // Risk:Reward Block
            html += `
            <div class="result-block">
                <div class="result-title">📊 Risk:Reward Ratio</div>
            `;
            if (data.riskReward1) {
                const rr1Color = data.riskReward1 >= 2 ? 'green' : data.riskReward1 >= 1.5 ? 'gold' : 'red';
                html += `<div class="result-row"><span class="result-label-sm">R:R at Target 1</span><span class="result-value-lg ${rr1Color}">1:${fmtD(data.riskReward1, 1)}</span></div>`;
            }
            if (data.riskReward2) {
                const rr2Color = data.riskReward2 >= 2 ? 'green' : data.riskReward2 >= 1.5 ? 'gold' : 'red';
                html += `<div class="result-row"><span class="result-label-sm">R:R at Target 2</span><span class="result-value-lg ${rr2Color}">1:${fmtD(data.riskReward2, 1)}</span></div>`;
            }
            if (!data.riskReward1) {
                html += `<div class="result-row"><span class="result-label-sm">Set Target Price</span><span class="result-value-sm">—</span></div>`;
            }
            html += `</div>`;

            // Brokerage
            html += `
            <div class="result-block">
                <div class="result-title">💰 Costs</div>
                <div class="result-row"><span class="result-label-sm">Total Brokerage</span><span class="result-value-sm red">-${inr(data.totalBrokerage)}</span></div>
                <div class="result-row"><span class="result-label-sm">Net Profit (after costs)</span><span class="result-value-md green">${data.totalTargetGain > 0 ? inr(data.totalTargetGain - data.totalBrokerage) : '—'}</span></div>
            </div>`;

            // Action Plan
            html += `
            <div class="result-block" style="background:var(--surface);border:1.5px solid var(--accent);">
                <div class="result-title">✅ Trade Execution Plan</div>
                <div style="font-size:0.82rem;line-height:1.6;color:var(--text);">
                    <strong>${data.direction}</strong> ${data.totalShares} shares at avg <strong>${inr(data.avgEntryPrice)}</strong><br>
                    🛑 Stop Loss: <strong style="color:var(--bear);">${inr(data.actualSLPrice)}</strong> (Risk: ${inr(data.totalRiskAmount)})<br>
                    ${data.target1 ? '🎯 Target 1: <strong style="color:var(--bull);">'+inr(data.target1)+'</strong> — Sell '+Math.floor(data.totalShares*data.target1Qty/100)+' shares<br>' : ''}
                    ${data.target2 ? '🎯 Target 2: <strong style="color:var(--bull);">'+inr(data.target2)+'</strong> — Sell remaining<br>' : ''}
                    ${data.trailingSL > 0 ? '📌 Trail SL by <strong>'+data.trailingSL+'</strong> points after Target 1 hit' : ''}
                </div>
            </div>`;

            document.getElementById('resultsContent').innerHTML = html;

            // Show warning if capital used > 25%
            if (data.capitalUsedPercent > 25) {
                const warn = document.getElementById('warningBanner');
                warn.textContent = '⚠️ Position uses ' + fmtD(data.capitalUsedPercent, 1) + '% of capital. For intraday, consider keeping it under 25%. Reduce risk % or widen stop loss.';
                warn.classList.add('show');
            }
        }

        function showWarning(msg) {
            document.getElementById('emptyResults').style.display = 'block';
            document.getElementById('resultsContent').style.display = 'none';
            document.getElementById('emptyResults').innerHTML = `<div class="emoji">⚠️</div><p>${msg}</p>`;
            const warn = document.getElementById('warningBanner');
            warn.textContent = msg;
            warn.classList.add('show');
            setTimeout(() => warn.classList.remove('show'), 3000);
        }

        function resetAll() {
            document.querySelectorAll('input[type="number"]').forEach(inp => inp.value = '');
            document.getElementById('riskPercent').value = '2';
            document.getElementById('lotSize').value = '1';
            document.getElementById('brokerage').value = '20';
            document.getElementById('slType').value = 'price';
            document.getElementById('atrMultiplier').value = '1.5';
            document.getElementById('target1Qty').value = '50';
            document.getElementById('trailingSL').value = '0';
            document.getElementById('entryQty1').value = '100';
            
            // Hide extra entries
            for (let i = 2; i <= 3; i++) {
                document.getElementById('entryRow' + i).style.display = 'none';
                document.getElementById('entryPrice' + i).value = '';
                document.getElementById('entryQty' + i).value = '';
            }
            entryCount = 1;
            document.getElementById('addEntryBtn').style.display = 'block';
            
            toggleSLFields();
            document.getElementById('emptyResults').style.display = 'block';
            document.getElementById('resultsContent').style.display = 'none';
            document.getElementById('warningBanner').classList.remove('show');
            document.getElementById('emptyResults').innerHTML = '<div class="emoji">📝</div><p>Enter parameters & click <strong>Calculate</strong></p>';
            document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
        }

        // Initialize
        toggleSLFields();
    </script>
</body>
</html>
