<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail - TradingHub</title>
    <style>
        :root {
            --bg-primary: #0D0D0D;
            --bg-card: #1A1A1A;
            --accent-gold: #FFB800;
            --accent-green: #00C853;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
        }

        .back-nav {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .product-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: var(--border-radius);
            background: var(--bg-card);
        }

        .product-details h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .product-details .category-tag {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: rgba(255,184,0,0.15);
            color: var(--accent-gold);
        }

        .product-details .description {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .price-display {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        .price-display .original {
            font-size: 1.2rem;
            color: #757575;
            text-decoration: line-through;
            margin-left: 1rem;
        }

        .savings {
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 2rem;
        }

        /* === UPI PAYMENT SECTION === */
        .payment-section {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .payment-section h3 {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
        }

        .upi-input-group {
            margin-bottom: 1.5rem;
        }

        .upi-input-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .upi-input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .upi-input-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .qr-placeholder {
            width: 200px;
            height: 200px;
            background: #fff;
            border-radius: 10px;
            margin: 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 700;
            text-align: center;
            font-size: 0.8rem;
        }

        .pay-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .pay-btn:hover {
            background: #FFD54F;
            transform: scale(1.02);
        }

        .whatsapp-btn {
            width: 100%;
            padding: 1rem;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: all 0.3s;
        }

        .whatsapp-btn:hover {
            background: #1ebe57;
        }

        .trust-badges {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .trust-badge {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="back-btn">← Back to Products</a>
    </div>

    <div class="product-container">
        <div>
            <img id="productImage" class="product-image" src="" alt="Product Image" 
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect fill=%22%231a1a1a%22 width=%22400%22 height=%22400%22/><text fill=%22%23FFB800%22 font-size=%2280%22 text-anchor=%22middle%22 x=%22200%22 y=%22220%22>📷</text></svg>'">
        </div>
        <div class="product-details">
            <span id="productCategory" class="category-tag"></span>
            <h1 id="productTitle"></h1>
            <p id="productDescription" class="description"></p>
            <div id="productPrice" class="price-display"></div>
            <div id="productSavings" class="savings"></div>

            <!-- UPI PAYMENT SECTION -->
            <div class="payment-section">
                <h3>💳 Pay via UPI</h3>
                <div class="upi-input-group">
                    <label>Your UPI ID (e.g., name@upi)</label>
                    <input type="text" id="userUpiId" placeholder="Enter your UPI ID">
                </div>
                <div class="upi-input-group">
                    <label>Amount to Pay</label>
                    <input type="text" id="paymentAmount" readonly>
                </div>
                <div class="qr-placeholder" id="qrCode">
                    📱 Scan QR Code<br>to Pay
                </div>
                <button class="pay-btn" onclick="initiateUpiPayment()">💰 Pay Now with UPI</button>
                <button class="whatsapp-btn" onclick="contactViaWhatsApp()">💬 Order via WhatsApp</button>
                <div class="trust-badges">
                    <span class="trust-badge">🔒 Secure Payment</span>
                    <span class="trust-badge">✅ Instant Confirmation</span>
                    <span class="trust-badge">🚚 Free Shipping >₹999</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load product data from sessionStorage
        const product = JSON.parse(sessionStorage.getItem('currentProduct'));

        if (product) {
            document.getElementById('productImage').src = product.image;
            document.getElementById('productTitle').textContent = product.title;
            document.getElementById('productDescription').textContent = product.fullDescription || product.description;
            document.getElementById('productCategory').textContent = product.category.toUpperCase();
            
            if (product.price) {
                document.getElementById('productPrice').innerHTML = `
                    ₹${product.price.toLocaleString('en-IN')}
                    ${product.originalPrice ? `<span class="original">₹${product.originalPrice.toLocaleString('en-IN')}</span>` : ''}
                `;
                document.getElementById('paymentAmount').value = product.price;
                
                if (product.originalPrice) {
                    const savings = product.originalPrice - product.price;
                    document.getElementById('productSavings').textContent = `You save ₹${savings.toLocaleString('en-IN')} (${Math.round((savings/product.originalPrice)*100)}% OFF)`;
                }
            }
        } else {
            document.body.innerHTML = '<div style="text-align:center;padding:4rem;"><h1>Product not found</h1><a href="index.html" style="color:#FFB800;">Go back</a></div>';
        }

        // ============================================
        // UPI PAYMENT INTEGRATION
        // ============================================
        function initiateUpiPayment() {
            const amount = document.getElementById('paymentAmount').value;
            const userUpi = document.getElementById('userUpiId').value;
            
            if (!userUpi) {
                alert('Please enter your UPI ID');
                return;
            }

            // Construct UPI Deep Link
            const upiId = product.upiId || 'yourupi@bank'; // <-- CHANGE THIS
            const payeeName = product.payeeName || 'TradingHub';
            const transactionNote = `Order for ${product.title}`;
            
            // UPI Intent URL
            const upiLink = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&tn=${encodeURIComponent(transactionNote)}&cu=INR`;
            
            // Try to open UPI app
            window.location.href = upiLink;
            
            // Fallback: Show manual instructions after 2 seconds
            setTimeout(() => {
                alert(`📱 If UPI app didn't open:\n\nSend ₹${amount} to:\nUPI ID: ${upiId}\nName: ${payeeName}\n\nAfter payment, share screenshot on WhatsApp for instant confirmation!`);
            }, 2000);
        }

        function contactViaWhatsApp() {
            const amount = document.getElementById('paymentAmount').value;
            const phone = '919XXXXXXXXX'; // <-- CHANGE TO YOUR WHATSAPP NUMBER
            const message = encodeURIComponent(`Hi TradingHub! I want to order:\n\n📦 ${product.title}\n💰 ₹${amount}\n\nPlease confirm my order.`);
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        // Generate QR Code placeholder (in production, use a QR library)
        document.getElementById('qrCode').innerHTML = `
            <div style="text-align:center;">
                <p style="font-weight:700;color:#000;">UPI QR CODE</p>
                <p style="font-size:0.7rem;color:#333;">Scan to Pay ₹${product?.price || '---'}</p>
                <p style="font-size:0.6rem;color:#666;">${product?.upiId || 'yourupi@bank'}</p>
            </div>
        `;
    </script>
</body>
</html>
