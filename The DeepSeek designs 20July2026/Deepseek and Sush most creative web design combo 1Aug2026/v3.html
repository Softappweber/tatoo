<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Post Grid | Fast Web Dev</title>
    <style>
        /* === ADVANCED CSS SETUP === */
        :root {
            --bg-primary: #121212;
            --bg-card: #1E1E1E;
            --accent-gold: #FFB800;
            --accent-green: #00C853;
            --accent-red: #FF1744;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border-radius: 12px;
            --transition-speed: 0.3s;
            --grid-gap: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* === STICKY NAVIGATION === */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent-gold);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-speed);
            position: relative;
            padding-bottom: 5px;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width var(--transition-speed);
        }

        .nav-menu a:hover {
            color: var(--text-primary);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        /* === HERO SECTION === */
        .hero {
            text-align: center;
            padding: 4rem 2rem 3rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #FFFFFF, #FFB800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        /* === POSTS GRID - ADVANCED CSS GRID === */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--grid-gap);
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* === POST CARD === */
        .post-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            border: 1px solid rgba(255, 255, 255, 0.03);
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            position: relative;
        }

        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(255, 184, 0, 0.15);
        }

        .post-image-container {
            width: 100%;
            height: 260px;
            overflow: hidden;
            position: relative;
            background: #2A2A2A;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .post-card:hover .post-image-container img {
            transform: scale(1.05);
        }

        /* Fallback placeholder styling */
        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-size: 4rem;
            color: var(--accent-gold);
            font-weight: 800;
        }

        .post-number {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent-gold);
            color: #000;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            z-index: 2;
        }

        .post-content {
            padding: 1.5rem;
        }

        .post-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--accent-gold);
        }

        .post-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        /* === PRODUCT DETAILS === */
        .product-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .spec-tag {
            background: rgba(255, 184, 0, 0.1);
            color: var(--accent-gold);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 184, 0, 0.2);
        }

        .spec-tag.size {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spec-tag.color-tag {
            background: rgba(156, 100, 12, 0.3);
            color: #D4A843;
            border: 1px solid rgba(212, 168, 67, 0.3);
        }

        /* === PRICE SECTION === */
        .price-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .price .currency {
            font-size: 1rem;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .price .amount {
            color: var(--accent-green);
        }

        .buy-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .buy-btn:hover {
            background: #FFD54F;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 184, 0, 0.3);
        }

        .stock-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent-green);
            color: #000;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 2;
            text-transform: uppercase;
        }

        /* === FOOTER === */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 3rem;
        }

        /* === ANIMATIONS === */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .nav-menu {
                gap: 1.5rem;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            .posts-grid {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- STICKY NAVIGATION -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">⚡ RapidSite</div>
            <ul class="nav-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Articles</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Our Latest Stories</h1>
        <p>Explore our collection of articles, insights, and visual journeys.</p>
    </section>

    <!-- DYNAMIC POSTS GRID -->
    <div class="posts-grid" id="postsGrid">
        <!-- Posts dynamically inserted here -->
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 RapidSite. Built with speed and precision.</p>
    </footer>

    <script>
        // ============================================
        // POST MANAGEMENT ENGINE
        // ============================================

        const postsData = [
            {
                id: 1,
                image: '1.jpg',
                title: '🐂 Bull vs Bear – Stock Market Showdown',
                description: 'A stunning miniature statue capturing the eternal battle between the Bull and the Bear — the two iconic symbols of the stock market. Crafted with intricate detail, this piece features a charging bull in polished metallic bronze finish locked in dynamic struggle with a fierce bear in deep matte charcoal black. The statue sits on a solid wooden base with a subtle market chart engraved on the front. Perfect for desks, offices, or as a gift for traders and finance enthusiasts.',
                specs: [
                    { label: 'Height', value: '6.5 inches', type: 'size' },
                    { label: 'Width', value: '8 inches', type: 'size' },
                    { label: 'Weight', value: '450 grams', type: 'size' },
                    { label: 'Material', value: 'Polyresin', type: 'size' },
                    { label: 'Bull Color', value: 'Bronze Gold', type: 'color-tag' },
                    { label: 'Bear Color', value: 'Charcoal Black', type: 'color-tag' },
                    { label: 'Base', value: 'Solid Wood', type: 'color-tag' }
                ],
                price: 700,
                inStock: true
            },
            {
                id: 2,
                image: '2.jpg',
                title: 'Post Title 2',
                description: 'This is the description for post number two. Replace this with your detailed article or description text.',
                specs: [],
                price: null,
                inStock: false
            },
            {
                id: 3,
                image: '3.jpg',
                title: 'Post Title 3',
                description: 'This is the description for post number three. Replace this with your detailed article or description text.',
                specs: [],
                price: null,
                inStock: false
            },
            {
                id: 4,
                image: '4.jpg',
                title: 'Post Title 4',
                description: 'This is the description for post number four. Replace this with your detailed article or description text.',
                specs: [],
                price: null,
                inStock: false
            }
        ];

        /**
         * Creates a post card element with smart image handling.
         */
        function createPostCard(post) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'post-card';
            cardDiv.style.animationDelay = `${post.id * 0.1}s`;

            // Create image container
            const imageContainer = document.createElement('div');
            imageContainer.className = 'post-image-container';

            // Stock badge for products
            if (post.inStock) {
                const stockBadge = document.createElement('span');
                stockBadge.className = 'stock-badge';
                stockBadge.textContent = 'In Stock';
                imageContainer.appendChild(stockBadge);
            }

            // Create image element
            const img = document.createElement('img');
            img.src = post.image;
            img.alt = post.title;
            img.loading = 'lazy';

            // Smart fallback
            img.onerror = function() {
                const placeholder = document.createElement('div');
                placeholder.className = 'image-placeholder';
                placeholder.innerHTML = `📷 ${post.id}`;
                imageContainer.innerHTML = '';
                if (post.inStock) {
                    const stockBadge = document.createElement('span');
                    stockBadge.className = 'stock-badge';
                    stockBadge.textContent = 'In Stock';
                    imageContainer.appendChild(stockBadge);
                }
                imageContainer.appendChild(placeholder);
                const badge = document.createElement('span');
                badge.className = 'post-number';
                badge.textContent = post.id;
                imageContainer.appendChild(badge);
            };

            imageContainer.appendChild(img);

            // Post number badge
            const postNumber = document.createElement('span');
            postNumber.className = 'post-number';
            postNumber.textContent = post.id;
            imageContainer.appendChild(postNumber);

            // Post content
            const postContent = document.createElement('div');
            postContent.className = 'post-content';
            
            let specsHTML = '';
            if (post.specs && post.specs.length > 0) {
                specsHTML = '<div class="product-specs">';
                post.specs.forEach(spec => {
                    specsHTML += `<span class="spec-tag ${spec.type}">${spec.label}: ${spec.value}</span>`;
                });
                specsHTML += '</div>';
            }

            let priceHTML = '';
            if (post.price) {
                priceHTML = `
                    <div class="price-section">
                        <div class="price">
                            <span class="currency">₹</span>
                            <span class="amount">${post.price.toLocaleString('en-IN')}</span>
                        </div>
                        <button class="buy-btn" onclick="alert('Added to cart! 🛒')">Buy Now</button>
                    </div>
                `;
            }

            postContent.innerHTML = `
                <h2 class="post-title">${post.title}</h2>
                <p class="post-description">${post.description}</p>
                ${specsHTML}
                ${priceHTML}
            `;

            // Assemble card
            cardDiv.appendChild(imageContainer);
            cardDiv.appendChild(postContent);

            return cardDiv;
        }

        /**
         * Renders all posts from postsData into the grid.
         */
        function renderAllPosts() {
            const grid = document.getElementById('postsGrid');
            if (!grid) return;

            grid.innerHTML = '';

            postsData.forEach(post => {
                const card = createPostCard(post);
                grid.appendChild(card);
            });

            console.log(`✅ Rendered ${postsData.length} posts successfully.`);
        }

        /**
         * Adds a new post dynamically and re-renders.
         */
        function addNewPost(id, image, title, description, specs = [], price = null, inStock = false) {
            postsData.push({ id, image, title, description, specs, price, inStock });
            renderAllPosts();
            console.log(`➕ Added Post #${id}: "${title}"`);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderAllPosts();
            console.log('🚀 RapidSite Engine Ready.');
            console.log('📦 Post 1: Bull vs Bear Statue - ₹700');
        });

        // Expose to global scope
        window.addNewPost = addNewPost;
        window.postsData = postsData;
    </script>
</body>
</html>
